[project]
name = "xlabel"
version = "0.3.1"
description = "Self-Contained Image Annotation Toolkit with GUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=9.0.0",
]

# This creates command-line scripts for the CLI and GUI
# after installing the package.
[project.scripts]
xlabel = "xlabel.cli:main"
xlabel-gui = "xlabel.main:main"

# Optional dependencies for GUI, development, and ML.
# Install with: pip install -e .[gui] or pip install -e .[dev]
[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
]
dev = [
    "pytest",
    "black",
    "ruff",
]
ml = [
    "ultralytics",
]

[tool.black]
line-length = 88

[tool.setuptools.packages.find]
include = ["xlabel*"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
]
